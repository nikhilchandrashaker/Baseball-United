const T=['Players','Countries','Career Levels','History','Standings & Games'];let tab=0;

function players(){

function countries(){const m={};D.players.forEach(p=>{const c=p.cty||'Unknown';m[c]=(m[c]||0)+1});$('v').innerHTML=`<p class=mu>Players by birth country</p>`+bars(m)}
